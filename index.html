<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explainer Studio Pro</title>
    <meta name="theme-color" content="#0b1022" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
    <!-- Tailwind via CDN (nothing to install) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: { colors: { brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } },
      };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', sans-serif; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
      .timeline-block { touch-action: none; user-select: none; }
      @keyframes ai-float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
      @keyframes ai-glow { 0%, 100% { box-shadow: 0 12px 35px rgba(79,70,229,.28); } 50% { box-shadow: 0 12px 42px rgba(168,85,247,.55); } }
      .ai-director-bot { animation: ai-float 3.2s ease-in-out infinite, ai-glow 3.2s ease-in-out infinite; }

      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'Inter', sans-serif; background: #080b18; }
      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }
      .dashboard { min-height: 100%; background: radial-gradient(ellipse at 50% -20%, rgba(79,70,229,.19), transparent 48%), #080b18; }
      .dashboard-header { height: 76px; padding: 0 clamp(18px, 5vw, 72px); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(148,163,184,.12); background:rgba(10,14,30,.8); }
      .brand-lockup,.header-actions,.brand-mark,.offline-chip,.section-heading,.welcome-row,.dashboard-footer { display:flex; align-items:center; }
      .brand-lockup { gap:12px; }.brand-mark { width:42px;height:42px;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#9333ea);font-size:18px;box-shadow:0 8px 28px #6366f133; }
      .brand-name {font-weight:800;letter-spacing:-.04em;font-size:16px}.brand-name span,.welcome-row h1 span {color:#a5a4ff}.brand-subtitle {font-size:11px;color:#8791aa;margin-top:3px}.header-actions {gap:10px}.offline-chip {gap:7px;font-size:11px;color:#a5b4fc;padding:9px 12px;border:1px solid #6366f133;border-radius:99px;background:#6366f10d}
      .btn-primary,.btn-secondary {border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:12px;transition:.2s}.btn-primary {background:linear-gradient(110deg,#4f46e5,#9333ea);color:white;box-shadow:0 8px 25px #6366f133}.btn-primary:hover {filter:brightness(1.12);transform:translateY(-1px)}.btn-secondary {color:#dbe2f2;background:#171d32;border:1px solid #29324d}.btn-secondary:hover {background:#202844}
      .dashboard-main {max-width:1180px;margin:auto;padding:clamp(28px,5vw,64px) clamp(18px,5vw,32px) 24px}.welcome-row {justify-content:space-between;gap:24px;margin-bottom:54px}.eyebrow {font-size:10px;letter-spacing:.2em;color:#9297ff;font-weight:800;margin:0 0 12px}.welcome-row h1 {font-size:clamp(30px,5vw,48px);line-height:1.05;letter-spacing:-.055em;margin:0;font-weight:850}.welcome-copy {color:#929bb1;font-size:14px;margin:12px 0 0}.create-button {padding:14px 20px;white-space:nowrap}.projects-section {min-height:270px}.section-heading {justify-content:space-between;margin-bottom:20px}.section-heading h2 {font-size:18px;margin:0;font-weight:750}.section-heading p {font-size:11px;color:#8590a8;margin:5px 0 0}.local-label {font-size:10px;color:#8491a9}.local-label i {color:#818cf8;margin-right:5px}.project-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.project-card {overflow:hidden;border:1px solid #202943;border-radius:17px;background:#10162a;transition:.2s}.project-card:hover {border-color:#615cf0;transform:translateY(-3px);box-shadow:0 15px 35px #0004}.project-open {width:100%;text-align:left;background:none;border:0;padding:0;color:inherit}.project-art {height:142px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,#5145b8 0,#27265e 36%,#151b38 72%)}.project-art>i {font-size:36px;color:#fff;filter:drop-shadow(0 8px 15px #080b18aa);z-index:1}.project-art>span {position:absolute;bottom:11px;left:13px;font-size:10px;color:#e1e5ff;background:#0b102288;padding:5px 8px;border-radius:7px}.art-orbit {position:absolute;border:1px solid #c4b5fd55;border-radius:50%;width:180px;height:180px;transform:rotate(-25deg) scaleY(.45)}.orbit-two {width:240px;height:240px;transform:rotate(35deg) scaleY(.38)}.project-info {padding:14px 15px 11px}.project-info h3 {font-size:13px;margin:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-info p {font-size:10px;color:#8490a8;margin:6px 0 0}.project-actions {display:flex;justify-content:flex-end;gap:5px;padding:0 10px 10px}.project-actions button {width:30px;height:28px;border:0;border-radius:8px;color:#8994ad;background:transparent}.project-actions button:hover {background:#252d48;color:white}.empty-state {border:1px dashed #303956;border-radius:18px;padding:44px 20px;text-align:center;color:#8f9ab2;background:#0e1426}.empty-state h3 {color:#f0f2ff;font-size:16px;margin:14px 0 6px}.empty-state p {font-size:12px;margin:0 0 18px}.empty-icon {margin:auto;width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#6366f11c;color:#a5a4ff;font-size:20px}.storage-warning {padding:12px;border-radius:10px;background:#78350f33;color:#fbbf24;font-size:12px;margin-bottom:18px}.dashboard-footer {justify-content:space-between;border-top:1px solid #202943;margin-top:56px;padding-top:18px;color:#69758e;font-size:10px}.dashboard-footer span:last-child i {margin-right:5px;color:#818cf8}
      .header-project-meta {display:flex;align-items:center;gap:10px;margin-top:4px}.header-project-meta input {width:min(230px,30vw);border:0;outline:0;background:transparent;color:#9ba6bf;font-size:10px;padding:0}.header-project-meta input:focus {color:white}.save-indicator {font-size:10px;color:#8b9ab5;white-space:nowrap}.save-indicator i {color:#818cf8;margin-right:4px}
      @media(max-width:640px) { .dashboard-header {height:64px;padding:0 15px}.brand-mark{width:36px;height:36px}.brand-subtitle,.offline-chip {display:none}.brand-name{font-size:14px}.header-actions{gap:7px}.btn-secondary{padding:9px 11px}.dashboard-main{padding-top:34px}.welcome-row{align-items:flex-start;flex-direction:column;margin-bottom:36px}.welcome-row h1{font-size:34px}.create-button{width:100%;justify-content:center}.section-heading{align-items:flex-start}.local-label{font-size:9px}.project-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.project-art{height:105px}.project-info{padding:11px}.project-actions{padding:0 7px 7px}.dashboard-footer{gap:10px;align-items:flex-start;flex-direction:column;margin-top:36px}.header-project-meta{gap:5px;flex-direction:column;align-items:flex-start}.header-project-meta input{width:125px}.save-indicator{font-size:9px}.studio-header-subtitle{display:none} }
      @media(max-width:390px) {.project-grid{grid-template-columns:1fr}.project-art{height:130px}}

      /* Studio layout: desktop remains a two-pane editor; small screens become a stacked touch workspace. */
      .studio-shell { min-height: 0; min-height: 100dvh; }
      .studio-workspace, .studio-main, .studio-sidebar { min-width: 0; min-height: 0; }
      .studio-tab-content { overscroll-behavior: contain; }
      .studio-tabbar button { min-height: 48px; touch-action: manipulation; }
      .studio-shell button, .studio-shell input, .studio-shell select, .studio-shell textarea { touch-action: manipulation; }
      .studio-preview-frame { max-width: 100%; }
      .studio-timeline { min-height: 230px; }
      @media (max-width: 760px) {
        html, body, #root { height: 100%; min-height: 100%; overflow: hidden; }
        .studio-shell { height: 100dvh; min-height: 0; padding-bottom: env(safe-area-inset-bottom); }
        .studio-header { height: 58px; min-height: 58px; padding: 0 9px; gap: 6px; }
        .studio-header > div:first-child { gap: 7px; min-width: 0; }
        .studio-header > div:first-child > div:nth-child(2) { display: none; }
        .studio-header h1 { font-size: 12px; white-space: nowrap; }
        .studio-header .header-project-meta { margin-top: 3px; flex-direction: row; gap: 6px; }
        .studio-header .header-project-meta input { width: 112px; font-size: 10px; }
        .studio-header .save-indicator { font-size: 9px; }
        .studio-header > div:last-child { gap: 6px; }
        .studio-header .studio-settings-btn, .studio-header .studio-export-btn { min-height: 38px; padding: 0 10px; justify-content: center; }
        .studio-header .studio-settings-btn span { display: none; }
        .studio-header .studio-export-btn { font-size: 10px; }
        .studio-workspace { flex-direction: column-reverse; }
        .studio-main { flex: 1 1 auto; min-height: 0; width: 100%; }
        .studio-preview { min-height: 0; padding: 42px 10px 8px; }
        .studio-preview > div:first-child { top: 6px; left: 10px; }
        .studio-preview-frame { width: min(100%, 42vh) !important; height: auto !important; max-height: 100%; aspect-ratio: var(--preview-ratio); border-radius: 12px; }
        .studio-sidebar { width: 100%; height: min(43dvh, 350px); flex: 0 0 min(43dvh, 350px); border-right: 0; border-top: 1px solid #263149; }
        .studio-tabbar { flex: 0 0 auto; padding: 4px 5px; gap: 3px; }
        .studio-tabbar { overflow-x: auto; scrollbar-width: none; }
        .studio-tabbar::-webkit-scrollbar { display: none; }
        .studio-tabbar button { flex: 0 0 auto; min-width: 62px; min-height: 49px; padding: 5px 5px; font-size: 9px; white-space: nowrap; }
        .studio-tabbar button span { max-width: 68px; overflow: hidden; text-overflow: ellipsis; }
        .studio-tabbar button i { font-size: 14px; }
        .studio-tab-content { padding: 10px; gap: 10px; -webkit-overflow-scrolling: touch; }
        .studio-tab-content input, .studio-tab-content textarea, .studio-tab-content select { font-size: 16px; }
        .studio-sidebar { overflow: hidden; }
        .studio-main { overflow: hidden; }
        .studio-preview { overflow: auto; }
        .studio-timeline { overflow-x: auto; }
        .studio-header .studio-export-btn { white-space: nowrap; }
        .studio-tab-content > * { min-width: 0; }
        .studio-timeline { height: 150px; min-height: 150px; flex: 0 0 150px; }
        .studio-timeline > div:first-child { height: 42px; min-height: 42px; padding: 0 9px; }
        .studio-timeline > div:first-child > div:last-child { display: none; }
        .studio-timeline > div:first-child > div:first-child { gap: 7px; }
        .studio-timeline > div:first-child span { font-size: 10px; }
        .studio-timeline > div:nth-child(2) { padding: 8px 9px; }
        .studio-timeline > div:nth-child(2) > div:first-child { min-width: 620px; }
        .studio-timeline .timeline-block { touch-action: none; padding: 0 7px; font-size: 10px; }
        .studio-timeline .timeline-block i { display: none; }
        .studio-timeline > div:nth-child(2) > div:last-child { margin-top: 5px; }
        .ai-director-bot { animation: none; }
      }
      @media (max-width: 390px) {
        .studio-header .studio-export-btn { padding: 0 8px; }
        .studio-header .studio-export-btn span { font-size: 9px; }
        .studio-sidebar { height: 45dvh; flex-basis: 45dvh; }
        .studio-tabbar button { font-size: 9px; }
      }
      @media (max-width: 480px) {
        .studio-header h1 { font-size: 11px; }
        .studio-header .header-project-meta input { width: 94px; }
        .studio-header .studio-export-btn { padding: 0 7px; }
        .studio-tabbar button { min-width: 58px; }
        .studio-tab-content { padding: 8px; }
        .studio-timeline .timeline-block { min-width: 58px; }
      }
      @media (max-height: 700px) and (max-width: 760px) {
        .studio-sidebar { height: 39dvh; flex-basis: 39dvh; }
        .studio-timeline { height: 128px; min-height: 128px; flex-basis: 128px; }
      }
    </style>
  </head>
  <body class="h-full bg-slate-950 text-slate-100">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
